      <stop offset="0%" stop-color="#ffe685"/>
      <stop offset="50%" stop-color="#fed65b"/>
      <stop offset="100%" stop-color="#c99e2a"/>
    </linearGradient>
    <linearGradient id="hwcMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a1525"/>
      <stop offset="100%" stop-color="#24050d"/>
    </linearGradient>
  </defs>
  <!-- Base circular shield -->
  <rect width="64" height="64" rx="16" fill="url(#hwcMaroon)"/>
