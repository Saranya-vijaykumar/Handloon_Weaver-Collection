  <line x1="36" y1="14" x2="36" y2="50" stroke="#fed65b" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="44" y1="14" x2="44" y2="50" stroke="#fed65b" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Horizontal Weft Weave Diamonds -->
  <path d="M14 32 L32 18 L50 32 L32 46 Z" fill="none" stroke="url(#hwcGold)" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="4.5" fill="url(#hwcGold)"/>
